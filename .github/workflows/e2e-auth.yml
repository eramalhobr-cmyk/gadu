name: GaDu e2e com login
# Testes de interface COM login, contra um Supabase LOCAL e descartável (supabase start no runner).
# Não usa NENHUM segredo nem credencial de produção: o usuário de teste é criado no banco temporário com senha aleatória.
# Roda em PR (mexeu em app, e2e ou banco), todo dia às 06:00 (Brasília) e à mão. Detalhes: docs/TESTES_E2E.md
on:
  pull_request:
    paths:
      - 'src/**'
      - 'e2e/**'
      - 'supabase/**'
      - 'scripts/e2e-auth-local.sh'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/e2e-auth.yml'
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e-auth:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Supabase local, usuário de teste, app e testes
        run: bash scripts/e2e-auth-local.sh
        env:
          E2E_APP_LOG: /tmp/next-auth.log
          E2E_DEBUG: '1'
      - name: Log do app (só se falhar)
        if: failure()
        run: tail -n 200 /tmp/next-auth.log || true
